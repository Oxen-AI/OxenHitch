[package]
name = "oxen-hitch"
version = "0.1.3"
edition = "2021"
description = "Run Claude Desktop on the Oxen.ai gateway."

[lib]
name = "oxen_hitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hitch-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Only to tell macOS that the popover belongs on every Space. See tray.rs.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
