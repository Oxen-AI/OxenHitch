name: Release

# Builds the macOS installer and publishes it as a GitHub release.
#
# Starts when a version tag (v1.2.3) is pushed, or when run by hand for an existing tag.
# The "Bump version" workflow does both steps for you: it makes the tag and then starts this.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release, such as v0.1.0. It must already exist.
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    name: Build and publish the macOS installer
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the version in the code
        run: node scripts/version.mjs check "$TAG"

      # One installer that runs on both Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Signing and notarization happen only when the repository has the Apple secrets.
      # Without them the app gets an ad-hoc signature (see tauri.conf.json), which runs but
      # makes macOS warn on first open. The secrets:
      #   APPLE_CERTIFICATE           a Developer ID Application certificate, as a base64 .p12
      #   APPLE_CERTIFICATE_PASSWORD  the password of that .p12
      #   APPLE_SIGNING_IDENTITY      its name, "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY               an App Store Connect API key's ID, used to notarize
      #   APPLE_API_ISSUER            that key's issuer ID
      #   APPLE_API_KEY_P8            the contents of that key's .p8 file
      - name: Use the Apple signing identity, if there is one
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate is configured. Building with an ad-hoc signature."
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is missing. Signing needs all six Apple secrets."
              exit 1
            fi
          done
          # The notarization tool reads the key from a file.
          key_file="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            {
              echo "$name<<__HITCH_END__"
              echo "${!name}"
              echo "__HITCH_END__"
            } >> "$GITHUB_ENV"
          done
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      - name: Write the release notes
        run: |
          {
            echo "## Install"
            echo
            echo "1. Download the \`.dmg\` below and open it."
            echo "2. Drag **Hitch** into **Applications**."
            echo "3. Open Hitch. Its icon appears in the menu bar."
            echo
            if [ "$SIGNED" = "yes" ]; then
              echo "Signed and notarized with Apple, so it opens like any other Mac app."
            else
              echo "> **This build is not signed with an Apple Developer ID.** macOS will refuse to open it the usual way."
              echo "> After dragging it to Applications, run this once in Terminal, then open Hitch normally:"
              echo ">"
              echo "> \`\`\`sh"
              echo "> xattr -cr /Applications/Hitch.app"
              echo "> \`\`\`"
            fi
            echo
            echo "Runs on Apple Silicon and Intel Macs, macOS 12 or later. Needs the Claude desktop app."
          } > "$RUNNER_TEMP/notes.md"
          {
            echo "RELEASE_NOTES<<__HITCH_END__"
            cat "$RUNNER_TEMP/notes.md"
            echo "__HITCH_END__"
          } >> "$GITHUB_ENV"

      - name: Build the installer and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Hitch ${{ env.TAG }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
